<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCOUT — Football Guesser</title>
<style>
  :root{
    --pitch-dark:#08261c;
    --pitch:#0e3a29;
    --chalk:#f2ede0;
    --chalk-dim:#c9c2ac;
    --amber:#ffb627;
    --amber-dim:#8a5f14;
    --line:#1f5940;
    --red:#e0563f;
    --shadow:#04150e;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:
      radial-gradient(ellipse at top, var(--pitch) 0%, var(--pitch-dark) 70%),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 80px);
    color:var(--chalk);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:28px 16px 60px;
  }
  .wrap{width:100%;max-width:640px;}
  .masthead{
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:2px solid var(--line);
    padding-bottom:14px; margin-bottom:22px;
  }
  .masthead-actions{display:flex; align-items:center; gap:8px;}
  .masthead h1{
    font-size:28px; letter-spacing:3px; margin:0;
    font-weight:800; text-transform:uppercase;
    color:var(--chalk);
  }
  .masthead h1 span{color:var(--amber);}
  .masthead .tag{
    font-size:11px; letter-spacing:2px; color:var(--chalk-dim);
    text-transform:uppercase; font-family:'Courier New', monospace;
  }
  .dial-row{
    display:flex; align-items:center; gap:18px; margin-bottom:26px;
  }
  .dial{
    position:relative; width:78px; height:78px; flex-shrink:0;
  }
  .dial svg{transform:rotate(-90deg);}
  .dial-num{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:22px; font-weight:800; font-family:'Courier New', monospace; color:var(--amber);
  }
  .dial-meta{flex:1;}
  .dial-meta .label{font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--chalk-dim); font-family:'Courier New', monospace;}
  .dial-meta .count{font-size:14px; color:var(--chalk); margin-top:2px;}
  .card{
    background:linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
    border:1px solid var(--line);
    border-radius:2px;
    padding:30px 26px;
    position:relative;
  }
  .card::before{
    content:'';
    position:absolute; top:0; left:0; right:0; height:3px;
    background:linear-gradient(90deg, var(--amber), transparent 60%);
  }
  .qnum{
    font-family:'Courier New', monospace; font-size:12px; letter-spacing:2px;
    color:var(--amber-dim); text-transform:uppercase; margin-bottom:10px;
  }
  .qtext{
    font-size:22px; line-height:1.35; font-weight:600; color:var(--chalk);
    margin-bottom:26px; min-height:60px;
  }
  .answers{
    display:grid; grid-template-columns:1fr 1fr; gap:10px;
  }
  .answers button{
    font-family:inherit; font-size:14px; font-weight:700; letter-spacing:0.5px;
    text-transform:uppercase; padding:14px 10px; border-radius:2px; cursor:pointer;
    border:1px solid var(--line); background:rgba(255,255,255,0.02); color:var(--chalk);
    transition:all 0.15s ease;
  }
  .answers button:hover{background:rgba(255,182,39,0.12); border-color:var(--amber-dim);}
  .answers .yes{grid-column:span 1; border-color:#2c6b4a;}
  .answers .no{border-color:#7a3226;}
  .answers .unsure{grid-column:span 2; background:transparent; color:var(--chalk-dim); border-style:dashed;}
  .footer-row{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:18px; font-size:11px; color:var(--chalk-dim); font-family:'Courier New', monospace;
  }
  .footer-row button{
    background:none; border:none; color:var(--chalk-dim); text-decoration:underline;
    cursor:pointer; font-family:inherit; font-size:11px;
  }
  .guess-card{text-align:center;}
  .guess-eyebrow{
    font-family:'Courier New', monospace; font-size:12px; letter-spacing:3px;
    color:var(--amber); text-transform:uppercase; margin-bottom:14px;
  }
  .guess-name{
    font-size:38px; font-weight:800; letter-spacing:1px; margin:0 0 8px;
    text-transform:uppercase;
  }
  .guess-meta{
    display:flex; justify-content:center; gap:18px; margin:16px 0 24px;
    font-family:'Courier New', monospace; font-size:12px; color:var(--chalk-dim);
    text-transform:uppercase; letter-spacing:1px; flex-wrap:wrap;
  }
  .guess-meta b{color:var(--chalk); display:block; font-size:13px; margin-top:2px;}
  .confirm-row{display:flex; gap:10px; justify-content:center;}
  .confirm-row button{
    font-family:inherit; font-weight:700; text-transform:uppercase; letter-spacing:0.5px;
    padding:14px 22px; border-radius:2px; cursor:pointer; font-size:13px;
    border:1px solid var(--line); background:rgba(255,255,255,0.02); color:var(--chalk);
  }
  .confirm-row .right{border-color:var(--amber-dim); background:rgba(255,182,39,0.1);}
  .eliminated{
    margin-top:22px; font-family:'Courier New', monospace; font-size:11px; color:var(--chalk-dim);
  }
  .settings{
    margin-top:28px; border-top:1px dashed var(--line); padding-top:16px;
  }
  .settings summary{cursor:pointer; font-size:12px; color:var(--chalk-dim); font-family:'Courier New', monospace; letter-spacing:1px; text-transform:uppercase;}
  .settings .inner{margin-top:14px; font-size:13px; color:var(--chalk-dim); line-height:1.6;}
  .settings input{
    width:100%; padding:10px; margin:8px 0; background:rgba(0,0,0,0.25); border:1px solid var(--line);
    color:var(--chalk); border-radius:2px; font-family:'Courier New', monospace; font-size:12px;
  }
  .settings button.sync{
    padding:9px 16px; background:rgba(255,182,39,0.1); border:1px solid var(--amber-dim);
    color:var(--amber); font-family:inherit; font-weight:700; text-transform:uppercase;
    font-size:11px; letter-spacing:1px; cursor:pointer; border-radius:2px;
  }
  .sync-status{margin-top:10px; font-size:11px; color:var(--chalk-dim);}
  .start-screen{text-align:center; padding:20px 6px 6px;}
  .start-screen p{color:var(--chalk-dim); line-height:1.7; font-size:14px; margin-bottom:24px;}
  .start-btn{
    padding:16px 36px; font-size:15px; font-weight:800; letter-spacing:1.5px; text-transform:uppercase;
    background:var(--amber); color:var(--pitch-dark); border:none; border-radius:2px; cursor:pointer;
  }
  .close-under{
    display:block; margin:12px auto 0;
    padding:12px 36px; font-size:13px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase;
    background:transparent; color:var(--chalk-dim);
    border:1px solid var(--line); border-radius:2px; cursor:pointer;
    font-family:inherit;
    transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
  }
  .close-under:hover{color:var(--red); border-color:#7a3226; background:rgba(224,86,63,0.08);}
  .win-screen{text-align:center;}
  .win-screen .big{font-size:20px; font-weight:800; text-transform:uppercase; letter-spacing:1px; color:var(--amber); margin-bottom:10px;}
  .menu-btn{
    background:none; border:1px solid var(--line); color:var(--chalk-dim);
    width:34px; height:34px; border-radius:2px; cursor:pointer; font-size:18px;
    line-height:1; display:flex; align-items:center; justify-content:center;
  }
  .menu-btn:hover{border-color:var(--amber-dim); color:var(--chalk);}
  .pause-overlay{
    position:fixed; inset:0; z-index:40;
    background:rgba(4,21,14,0.9);
    display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .pause-menu{
    display:flex; flex-direction:column; align-items:stretch;
    width:min(340px, 86vw); gap:10px;
    animation: riseIn 0.28s cubic-bezier(.2,.8,.2,1) both;
  }
  .pause-menu button{
    width:100%;
    color:var(--chalk); font-family:inherit;
    font-size:15px; font-weight:800; letter-spacing:2px;
    text-transform:uppercase; padding:16px 18px; cursor:pointer;
    background:rgba(255,255,255,0.03);
    border:1px solid var(--line);
    border-radius:2px;
    transition: color 0.15s ease, transform 0.12s ease, background 0.15s ease, border-color 0.15s ease;
  }
  .pause-menu button:hover{
    color:var(--amber);
    border-color:var(--amber-dim);
    background:rgba(255,182,39,0.1);
  }
  .pause-menu button:active{transform:scale(0.98);}
  .pause-menu button.quit{color:var(--red); border-color:#7a3226;}
  .pause-menu button.quit:hover{
    color:#ff7a66;
    background:rgba(224,86,63,0.12);
    border-color:var(--red);
  }
  .vol-row{
    width:100%; padding:14px 16px 16px;
    border:1px solid var(--line); border-radius:2px;
    background:rgba(255,255,255,0.03);
  }
  .vol-head{
    display:flex; justify-content:space-between;
    font-family:'Courier New', monospace; font-size:11px; letter-spacing:2px;
    text-transform:uppercase; color:var(--chalk-dim); margin-bottom:10px;
  }
  #volLabel{color:var(--amber);}
  .vol-row input[type=range]{
    width:100%; accent-color:#ffb627; cursor:pointer;
  }
  .mute-btn svg{width:16px; height:16px; display:block;}
  .mute-btn[aria-pressed="true"]{color:var(--chalk-dim); border-style:dashed;}
  .confirm-overlay{
    position:fixed; inset:0; z-index:50;
    background:rgba(4,21,14,0.72);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
  }
  .confirm-box{
    width:100%; max-width:360px;
    background:var(--pitch-dark);
    border:1px solid var(--line);
    border-radius:2px;
    padding:26px 22px 22px;
    text-align:center;
    box-shadow:0 16px 40px rgba(0,0,0,0.45);
    position:relative;
  }
  .confirm-box::before{
    content:'';
    position:absolute; top:0; left:0; right:0; height:3px;
    background:linear-gradient(90deg, var(--amber), transparent 60%);
  }
  .confirm-box p{
    color:var(--chalk); font-size:15px; line-height:1.5; margin:8px 0 22px;
  }
  .confirm-box .confirm-row button.yes{
    border-color:var(--red); color:var(--red);
  }

  /* ---------- motion ---------- */
  .masthead{
    animation: fadeDown 0.5s ease both;
  }
  .masthead h1 span{
    display:inline-block;
    animation: blinkDot 2.8s ease-in-out infinite;
  }
  .card{
    animation: riseIn 0.42s cubic-bezier(.2,.8,.2,1) both;
  }
  .card::before{
    transform-origin:left;
    animation: scanLine 0.7s ease both;
  }
  .dial{
    animation: popIn 0.45s cubic-bezier(.2,1.4,.3,1) both;
  }
  .dial svg circle:last-child{
    animation: ringDraw 0.8s ease both;
  }
  .dial-num{animation: tickPop 0.35s ease both;}
  .qtext{animation: chalkIn 0.4s ease 0.05s both;}
  .answers button{
    animation: riseIn 0.35s ease both;
    transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .answers button:nth-child(1){animation-delay:0.08s;}
  .answers button:nth-child(2){animation-delay:0.14s;}
  .answers button:nth-child(3){animation-delay:0.2s;}
  .answers button:hover{transform:translateY(-1px); box-shadow:0 6px 16px rgba(0,0,0,0.25);}
  .answers button:active{transform:scale(0.97);}
  .answers .yes:hover{background:rgba(44,107,74,0.25);}
  .answers .no:hover{background:rgba(224,86,63,0.12);}
  .start-btn, .confirm-row button{
    transition: transform 0.12s ease, box-shadow 0.2s ease, background 0.15s ease, filter 0.15s ease;
  }
  .start-btn{
    animation: pulseGlow 2.4s ease-in-out infinite;
  }
  .start-btn:hover{transform:translateY(-2px); filter:brightness(1.05);}
  .start-btn:active{transform:scale(0.98);}
  .confirm-row button:hover{transform:translateY(-1px);}
  .confirm-row button:active{transform:scale(0.97);}
  .menu-btn{transition: border-color 0.15s ease, color 0.15s ease, transform 0.12s ease, background 0.15s ease;}
  .menu-btn:hover{transform:translateY(-1px);}
  .menu-btn:active{transform:scale(0.94);}
  .guess-name{
    animation: stampIn 0.55s cubic-bezier(.2,1.3,.3,1) both;
    text-shadow: 0 0 24px rgba(255,182,39,0.25);
  }
  .guess-eyebrow{animation: fadeDown 0.35s ease both;}
  .guess-meta > div{animation: riseIn 0.4s ease both;}
  .guess-meta > div:nth-child(1){animation-delay:0.12s;}
  .guess-meta > div:nth-child(2){animation-delay:0.18s;}
  .guess-meta > div:nth-child(3){animation-delay:0.24s;}
  .win-screen .big{
    animation: stampIn 0.6s cubic-bezier(.2,1.3,.3,1) both;
  }
  .win-burst{
    position:relative;
  }
  .win-burst::after{
    content:'';
    position:absolute; left:50%; top:8px;
    width:8px; height:8px; border-radius:50%;
    background:var(--amber);
    box-shadow:
      -40px 12px 0 -2px var(--amber),
      42px 10px 0 -2px #f2ede0,
      -18px -16px 0 -3px var(--amber),
      22px -14px 0 -3px #c9c2ac,
      0 28px 0 -3px var(--amber);
    animation: burstOut 0.7s ease both;
    pointer-events:none;
  }
  .confirm-overlay{
    opacity:0;
    pointer-events:none;
    transition: opacity 0.2s ease;
  }
  .confirm-overlay.is-open{
    opacity:1;
    pointer-events:auto;
  }
  .confirm-overlay.is-open .confirm-box{
    animation: riseIn 0.28s cubic-bezier(.2,.8,.2,1) both;
  }
  .settings{animation: fadeDown 0.5s ease 0.15s both;}

  @keyframes riseIn{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:none;}
  }
  @keyframes fadeDown{
    from{opacity:0; transform:translateY(-8px);}
    to{opacity:1; transform:none;}
  }
  @keyframes chalkIn{
    from{opacity:0; letter-spacing:0.4px; filter:blur(2px);}
    to{opacity:1; letter-spacing:normal; filter:none;}
  }
  @keyframes popIn{
    from{opacity:0; transform:scale(0.7);}
    to{opacity:1; transform:none;}
  }
  @keyframes tickPop{
    from{transform:scale(0.6); opacity:0.4;}
    to{transform:none; opacity:1;}
  }
  @keyframes ringDraw{
    from{stroke-dashoffset:201;}
  }
  @keyframes scanLine{
    from{transform:scaleX(0);}
    to{transform:scaleX(1);}
  }
  @keyframes dropIn{
    from{opacity:0; transform:translateY(-6px) scale(0.96);}
    to{opacity:1; transform:none;}
  }
  @keyframes stampIn{
    0%{opacity:0; transform:scale(1.35) rotate(-4deg);}
    70%{opacity:1; transform:scale(0.98) rotate(1deg);}
    100%{opacity:1; transform:none;}
  }
  @keyframes pulseGlow{
    0%,100%{box-shadow:0 0 0 0 rgba(255,182,39,0.0);}
    50%{box-shadow:0 0 0 8px rgba(255,182,39,0.12);}
  }
  @keyframes blinkDot{
    0%,100%{opacity:1;}
    50%{opacity:0.25;}
  }
  @keyframes burstOut{
    from{opacity:0; transform:translate(-50%,0) scale(0.4);}
    40%{opacity:1;}
    to{opacity:0; transform:translate(-50%,-8px) scale(1.6);}
  }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation:none !important;
      transition:none !important;
    }
    .confirm-overlay{opacity:1;}
  }
</style>
</head>
<body>
<audio id="bgm" src="music.mp3" loop autoplay preload="auto"></audio>
<div class="wrap">
  <div class="masthead">
    <h1>SCOUT<span>.</span></h1>
    <div class="masthead-actions">
      <button class="menu-btn mute-btn" id="muteBtn" onclick="toggleMute()" aria-label="Mute music" aria-pressed="false" title="Music"></button>
      <button class="menu-btn" onclick="toggleMenu(event)" aria-label="Menu">&#9776;</button>
    </div>
  </div>
  <div id="app"></div>
</div>
<div id="menuOverlay" class="confirm-overlay pause-overlay" onclick="if(event.target===this) closeMenu()">
  <nav class="pause-menu" id="menuBody"></nav>
</div>
<div id="confirmOverlay" class="confirm-overlay" onclick="if(event.target===this) hideConfirm()">
  <div class="confirm-box" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="guess-eyebrow" id="confirmTitle">Quit session</div>
    <p id="confirmText">Leave this scouting session and return to the menu?</p>
    <div class="confirm-row">
      <button type="button" onclick="hideConfirm()">Cancel</button>
      <button type="button" class="yes" id="confirmYes" onclick="acceptConfirm()">Quit</button>
    </div>
  </div>
</div>

<script>
/* ---------------- BACKGROUND MUSIC ---------------- */
let bgmVol = parseFloat(localStorage.getItem("scout-bgm-vol"));
if(Number.isNaN(bgmVol)) bgmVol = 0.35;
let bgmMuted = localStorage.getItem("scout-bgm-muted") === "1";

const ICON_SOUND = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a9 9 0 0 1 0 14"/></svg>';
const ICON_MUTED = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>';

function bgmEl(){ return document.getElementById("bgm"); }

function paintMuteBtn(){
  const btn = document.getElementById("muteBtn");
  if(!btn) return;
  const off = bgmMuted || bgmVol === 0;
  btn.innerHTML = off ? ICON_MUTED : ICON_SOUND;
  btn.setAttribute("aria-pressed", off ? "true" : "false");
  btn.setAttribute("aria-label", off ? "Unmute music" : "Mute music");
  btn.title = off ? "Music off" : "Music on";
}

function applyMute(){
  const a = bgmEl();
  if(a){
    a.volume = bgmMuted ? 0 : bgmVol;
    a.muted = bgmMuted || bgmVol === 0;
  }
  paintMuteBtn();
  const slider = document.getElementById("volSlider");
  const label = document.getElementById("volLabel");
  if(slider) slider.value = Math.round(bgmVol * 100);
  if(label) label.textContent = Math.round(bgmVol * 100) + "%";
}

function startBgm(){
  const a = bgmEl();
  if(!a) return;
  a.loop = true;
  a.volume = bgmMuted ? 0 : bgmVol;
  a.muted = bgmMuted || bgmVol === 0;
  const play = a.play();
  if(play && play.catch) play.catch(function(){});
}

function toggleMute(){
  bgmMuted = !bgmMuted;
  localStorage.setItem("scout-bgm-muted", bgmMuted ? "1" : "0");
  applyMute();
  startBgm();
}

function setVolume(val){
  bgmVol = Math.max(0, Math.min(1, Number(val) / 100));
  localStorage.setItem("scout-bgm-vol", String(bgmVol));
  if(bgmVol > 0 && bgmMuted){
    bgmMuted = false;
    localStorage.setItem("scout-bgm-muted", "0");
  }
  applyMute();
  startBgm();
}

/* ---------------- DATA ---------------- */
const BIG5 = {
  "Manchester United":"Premier League","Manchester City":"Premier League","Chelsea":"Premier League","Liverpool":"Premier League",
  "Arsenal":"Premier League","Tottenham":"Premier League","Everton":"Premier League","Southampton":"Premier League",
  "Leicester City":"Premier League","Aston Villa":"Premier League","West Ham":"Premier League",
  "Barcelona":"La Liga","Real Madrid":"La Liga","Atletico Madrid":"La Liga","Sevilla":"La Liga","Valencia":"La Liga",
  "Real Sociedad":"La Liga","Zaragoza":"La Liga","Las Palmas":"La Liga","Sporting Gijon":"La Liga",
  "Juventus":"Serie A","AC Milan":"Serie A","Inter Milan":"Serie A","Napoli":"Serie A","AS Roma":"Serie A",
  "Fiorentina":"Serie A","Lazio":"Serie A","Salernitana":"Serie A","Como":"Serie A",
  "Bayern Munich":"Bundesliga","Borussia Dortmund":"Bundesliga","Schalke 04":"Bundesliga","Werder Bremen":"Bundesliga",
  "Wolfsburg":"Bundesliga","Bayer Leverkusen":"Bundesliga","VfB Stuttgart":"Bundesliga","Hoffenheim":"Bundesliga","RB Leipzig":"Bundesliga",
  "PSG":"Ligue 1","Monaco":"Ligue 1","Lyon":"Ligue 1","Lille":"Ligue 1","Marseille":"Ligue 1","Rennes":"Ligue 1",
  "Bordeaux":"Ligue 1","Guingamp":"Ligue 1","Le Mans":"Ligue 1","Metz":"Ligue 1","Brest":"Ligue 1","Boulogne":"Ligue 1","Caen":"Ligue 1"
};
const CONF = {
  "Argentina":"South America","Brazil":"South America","Uruguay":"South America",
  "Portugal":"Europe","Belgium":"Europe","Croatia":"Europe","England":"Europe","Poland":"Europe","France":"Europe",
  "Netherlands":"Europe","Germany":"Europe","Spain":"Europe","Italy":"Europe","Wales":"Europe","Sweden":"Europe","Georgia":"Europe",
  "Egypt":"Africa","Ivory Coast":"Africa","Nigeria":"Africa","Senegal":"Africa",
  "South Korea":"Asia"
};
// PLAYERS starts as the built-in seed dataset (works standalone, e.g. opened
// as a local file). If players.json is reachable alongside this page (same
// deployment, e.g. GitHub Pages), it's merged in on load — see loadPlayers().
let PLAYERS = [

/* -------------- LOAD LIVE-CACHED PLAYERS (players.json) -------------- */
let playersSource = "built-in";

async function loadPlayers(){
  try{
    const res = await fetch('./players.json', { cache: "no-store" });
    if(!res.ok) throw new Error("no players.json found (" + res.status + ")");
    const cache = await res.json();
    const fetched = Object.values(cache.players || {});
    if(fetched.length){
      // merge: fetched players extend/override the built-in seed list by name
      const byName = new Map(PLAYERS.map(p=>[p.n, p]));
      for(const fp of fetched){
        byName.set(fp.n, {
          n: fp.n, p: fp.p, nat: fp.nat, clubs: fp.clubs,
          cl: byName.get(fp.n)?.cl || 0, wc: byName.get(fp.n)?.wc || 0, bd: byName.get(fp.n)?.bd || 0,
          retired: fp.retired, young: fp.young
        });
      }
      PLAYERS = [...byName.values()];
      playersSource = `cached API data (${fetched.length} synced, ${PLAYERS.length} total, last synced ${cache.lastRun ? new Date(cache.lastRun).toLocaleDateString() : "unknown"})`;
    }
  }catch(e){
    playersSource = "built-in dataset only (players.json not found — that's expected if you're running this file standalone)";
  }
}

let state = {
  screen:"start", // start | asking | guessing | win | lose | quit
  candidates: [],
  asked: [],
  history: [], // {qid, answer}
  guessed: []
};

let menuOpen = false;

function toggleMenu(e){
  if(e) e.stopPropagation();
  menuOpen = !menuOpen;
  renderMenu();
}
function closeMenu(){
  menuOpen = false;
  renderMenu();
}
let confirmAction = null;
function showConfirm(title, text, yesLabel, action){
  closeMenu();
  confirmAction = action;
  document.getElementById("confirmTitle").textContent = title;
  document.getElementById("confirmText").textContent = text;
  document.getElementById("confirmYes").textContent = yesLabel;
  document.getElementById("confirmOverlay").classList.add("is-open");
}
function hideConfirm(){
  confirmAction = null;
  document.getElementById("confirmOverlay").classList.remove("is-open");
}
function acceptConfirm(){
  const fn = confirmAction;
  hideConfirm();
  if(fn) fn();
}
function askQuit(e){
  if(e) e.stopPropagation();
  showConfirm(
    "Quit session",
    "Leave this scouting session and return to the menu?",
    "Quit",
    doQuit
  );
}
function askClose(e){
  if(e) e.stopPropagation();
  showConfirm(
    "Close",
    "Close SCOUT?",
    "Close",
    closeWindow
  );
}
function doQuit(){
  menuOpen = false;
  state.screen = "start";
  state.candidates = [];
  state.asked = [];
  state.history = [];
  state.guessed = [];
  renderMenu();
  render();
}
function closeWindow(){
  menuOpen = false;
  renderMenu();
  try { window.open("", "_self"); } catch (err) {}
  try { window.close(); } catch (err) {}
  setTimeout(function(){
    state.screen = "exit";
    render();
  }, 50);
}
function renderMenu(){
  const overlay = document.getElementById('menuOverlay');
  const body = document.getElementById('menuBody');
  if(!overlay || !body) return;
  overlay.classList.toggle('is-open', menuOpen);
  if(!menuOpen) return;
  const vol = Math.round(bgmVol * 100);
  const inGame = state.screen !== "start" && state.screen !== "exit" && state.screen !== "quit";
  body.innerHTML = `
    <button type="button" onclick="closeMenu()">Resume</button>
    ${inGame ? `<button type="button" onclick="resetGame(); closeMenu();">Restart</button>` : ""}
    <div class="vol-row">
      <div class="vol-head"><span>Music</span><span id="volLabel">${vol}%</span></div>
      <input id="volSlider" type="range" min="0" max="100" value="${vol}" oninput="setVolume(this.value)">
    </div>
    ${inGame ? `<button type="button" class="quit" onclick="askQuit(event)">Quit</button>` : ""}
  `;
}
document.addEventListener('keydown', function(e){
  if(e.key !== "Escape") return;
  const confirm = document.getElementById('confirmOverlay');
  if(confirm && confirm.classList.contains('is-open')) hideConfirm();
  else closeMenu();
});

function resetGame(){
  state.screen = "asking";
  state.candidates = PLAYERS.slice();
  state.asked = [];
  state.history = [];
  state.guessed = [];
  pickNextQuestion();
  pushGameHistory();
  startBgm();
  render();
}

let gameHistoryPushed = false;
function pushGameHistory(){
  // Push exactly one history entry when entering gameplay, so the browser's
  // back button always returns to the main/start screen in one press,
  // regardless of how many questions/screens deep the player is.
  if(!gameHistoryPushed){
    history.pushState({ inGame: true }, "", location.href);
    gameHistoryPushed = true;
  }
}

window.addEventListener('popstate', function(){
  gameHistoryPushed = false;
  state.screen = "start";
  render();
});

function pickNextQuestion(){
  const remaining = QUESTIONS.filter(q=>!state.asked.includes(q.id));
  let best=null, bestScore=-1;
  for(const q of remaining){
    const yes = state.candidates.filter(p=>q.ev(p)).length;
    const no = state.candidates.length - yes;
    if(yes===0 || no===0) continue; // no discriminating value
    const score = Math.min(yes,no); // maximize balance
    if(score>bestScore){bestScore=score; best=q;}
  }
  state.currentQ = best; // may be null if exhausted
}

function answer(val){
  // val: 1 = yes, 0 = no, null = unsure
  const q = state.currentQ;
  state.asked.push(q.id);
  state.history.push({q, val});
  if(val!==null){
    state.candidates = state.candidates.filter(p => q.ev(p) === !!val);
  }
  proceed();
}

function proceed(){
  if(state.candidates.length<=1 || state.asked.length>=18 || !QUESTIONS.some(q=>!state.asked.includes(q.id))){
    makeGuess();
    return;
  }
  pickNextQuestion();
  if(!state.currentQ){ makeGuess(); return; }
  render();
}

function makeGuess(){
  const pool = state.candidates.filter(p=>!state.guessed.includes(p.n));
  state.currentGuess = pool[0] || null;
  state.screen = "guessing";
  render();
}

function confirmGuess(correct){
  if(correct || !state.currentGuess){
    state.screen = "win";
    render();
    return;
  }
  state.guessed.push(state.currentGuess.n);
  state.candidates = state.candidates.filter(p=>p.n!==state.currentGuess.n);
  if(state.candidates.length===0){
    state.screen="lose";
    render();
    return;
  }
  proceed();
}

/* -------------- RENDER -------------- */
function dial(pct){
  const r=32, c=2*Math.PI*r;
  const offset = c*(1-pct);
  return `<div class="dial"><svg width="78" height="78">
    <circle cx="39" cy="39" r="${r}" stroke="#1f5940" stroke-width="6" fill="none"/>
    <circle cx="39" cy="39" r="${r}" stroke="#ffb627" stroke-width="6" fill="none"
      stroke-dasharray="${c}" stroke-dashoffset="${offset}" stroke-linecap="round"/>
  </svg><div class="dial-num">${state.candidates.length}</div></div>`;
}

  const app = document.getElementById('app');
  if(state.screen==="start"){

        <p>Answer honestly with Yes / No / Not sure. I'll narrow it down.</p>
        <button class="start-btn" onclick="resetGame()">Start Scouting</button>
        <button type="button" class="close-under" onclick="askClose(event)">Close</button>
      </div>
      <div class="settings">
        <details>
          <summary>Data source &amp; live sync</summary>
          <div class="inner">
            This build ships with a curated dataset of ${PLAYERS.length} players. Currently playing with: ${playersSource}.
            <div style="margin-top:10px;">To grow the roster automatically, run <code>scripts/fetch-players.mjs</code> (see project README) — it caches fetched players into <code>players.json</code>, which this page loads automatically when deployed alongside it.</div>
          </div>
        </details>
      </div>
    `;
    return;
  }

  if(state.screen==="asking"){
    const total = PLAYERS.length;
    const pct = 1 - (state.candidates.length/total);
    app.innerHTML = `
      <div class="dial-row">
        ${dial(Math.max(pct,0.04))}
        <div class="dial-meta">
          <div class="label">Candidates remaining</div>
          <div class="count">${state.candidates.length} of ${total} profiles match so far</div>
        </div>
      </div>
      <div class="card">
        <div class="qnum">Question ${state.asked.length+1}</div>
        <div class="qtext">${state.currentQ ? state.currentQ.text : "Hmm, narrowing down..."}</div>
        <div class="answers">
          <button class="yes" onclick="answer(1)">Yes</button>
          <button class="no" onclick="answer(0)">No</button>
          <button class="unsure" onclick="answer(null)">Not sure / skip</button>
        </div>
        <div class="footer-row">
          <span>${state.asked.length} asked</span>
          <button onclick="resetGame()">Restart</button>
        </div>
      </div>
    `;
    return;
  }

  if(state.screen==="guessing"){
    const g = state.currentGuess;
    if(!g){
      app.innerHTML = `<div class="card guess-card"><div class="guess-eyebrow">Stumped</div>
        <div class="qtext">I've run out of candidates that fit your answers — you've beaten the database!</div>
        <button class="start-btn" onclick="resetGame()">Play Again</button></div>`;
      return;
    }
    app.innerHTML = `
      <div class="card guess-card">
        <div class="guess-eyebrow">My guess is</div>
        <div class="guess-name">${g.n}</div>
        <div class="guess-meta">
          <div>Position<b>${g.p}</b></div>
          <div>Nationality<b>${g.nat}</b></div>
          <div>Clubs<b>${g.clubs.length}</b></div>
        </div>
        <div class="confirm-row">
          <button class="right" onclick="confirmGuess(true)">That's right!</button>
          <button onclick="confirmGuess(false)">Not quite</button>
        </div>
      </div>
      <div class="eliminated">${state.guessed.length ? "Already ruled out: "+state.guessed.join(", ") : ""}</div>
    `;
    return;
  }

  if(state.screen==="win"){
    app.innerHTML = `
      <div class="card win-screen">
        <div class="big">Got it! 🎯</div>
        <div class="qtext">${state.currentGuess.n}, in ${state.asked.length} questions.</div>
        <button class="start-btn" onclick="resetGame()">Scout Another</button>
      </div>
    `;
    return;
  }

  if(state.screen==="lose"){
    app.innerHTML = `
      <div class="card win-screen">
        <div class="big">You win this round.</div>
        <div class="qtext">I've run out of profiles matching your answers. My dataset doesn't have them yet.</div>
        <button class="start-btn" onclick="resetGame()">Try Again</button>
      </div>
    `;
    return;
  }

  if(state.screen==="quit"){
    app.innerHTML = `
      <div class="card win-screen">
        <div class="guess-eyebrow">Session ended</div>
        <div class="qtext">Thanks for scouting. Come back anytime.</div>
        <button class="start-btn" onclick="resetGame()">New Session</button>
      </div>
    `;
    return;
  }
}

applyMute();
startBgm();
["click","touchstart","keydown","pointerdown"].forEach(function(ev){
  document.addEventListener(ev, startBgm, { capture: true });
});
const bgmNode = bgmEl();
if(bgmNode){
  bgmNode.addEventListener("canplay", startBgm);
  bgmNode.addEventListener("canplaythrough", startBgm);
}
render();
loadPlayers().then(render);
</script>
</body>
</html>
