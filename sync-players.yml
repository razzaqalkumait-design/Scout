name: Sync player data

on:
  schedule:
    - cron: "0 3 * * *"   # every night at 03:00 UTC — still well under the 100/day free tier
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch + cache player data
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: node scripts/fetch-players.mjs

      - name: Commit updated cache
        run: |
          git config user.name "player-sync-bot"
          git config user.email "actions@github.com"
          git add players.json
          git diff --cached --quiet || git commit -m "Sync player data"
          git push
